services:
  - type: web
    name: aicte-compliance-backend
    runtime: python
    plan: free
    rootDir: .
    python_version: "3.12"
    buildCommand: python -m pip install --no-cache-dir -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
